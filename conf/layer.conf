# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-i2c-sensor-demo"
BBFILE_PATTERN_meta-i2c-sensor-demo = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-i2c-sensor-demo = "6"

LAYERDEPENDS_meta-i2c-sensor-demo = "core"
LAYERSERIES_COMPAT_meta-i2c-sensor-demo = "scarthgap"
